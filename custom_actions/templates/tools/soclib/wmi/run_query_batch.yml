type: action
definition:
  title: "WMI: Run query batch"
  description: "Run multiple WQL queries in one call. Input array of { name, query }. Returns results with name and rows for each."
  display_group: "SOCLib / WMI"
  namespace: tools.soclib.wmi
  name: run_query_batch
  secrets:
    - name: soclib_wmi
      keys: ["WMI_SERVER", "WMI_USERNAME", "WMI_PASSWORD"]
      optional_keys: [WMI_FORCE_NTLMV2, WMI_NAMESPACE, WMI_DOMAIN]
  expects:
    queries:
      type: list[dict[str, Any]]
      description: "Array of objects with name and query. Example: [{ name: procs, query: SELECT * FROM Win32_Process }]."
    ip_hostname: { type: str | None, default: null }
    namespace: { type: str | None, default: null }
  steps:
    - ref: run
      action: integrations.soclib.wmi.run_query_batch
      args:
        queries: ${{ inputs.queries }}
        ip_hostname: ${{ inputs.ip_hostname }}
        namespace: ${{ inputs.namespace }}
  returns: ${{ steps.run.result }}
