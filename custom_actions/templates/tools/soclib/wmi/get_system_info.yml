type: action
definition:
  title: "WMI: Get system info"
  description: Get system information from Win32_ComputerSystem, Win32_OperatingSystem, Win32_BootConfiguration.
  display_group: "SOCLib / WMI"
  namespace: tools.soclib.wmi
  name: get_system_info
  secrets:
    - name: soclib_wmi
      keys: ["WMI_SERVER", "WMI_USERNAME", "WMI_PASSWORD"]
      optional_keys:
        - WMI_FORCE_NTLMV2
        - WMI_NAMESPACE
        - WMI_DOMAIN
  expects:
    ip_hostname: { type: str | None, description: "Optional. Target host. Example: 192.168.1.10.", default: null }
    namespace: { type: str | None, description: "Optional. WMI namespace. Default root/cimv2.", default: null }
  steps:
    - ref: get
      action: integrations.soclib.wmi.get_system_info
      args:
        ip_hostname: ${{ inputs.ip_hostname }}
        namespace: ${{ inputs.namespace }}
  returns: ${{ steps.get.result }}
