type: action
definition:
  title: "WMI: Get installed software"
  description: "Get installed software (Win32_Product). Warning: can be slow on large systems."
  display_group: "SOCLib / WMI"
  namespace: tools.soclib.wmi
  name: get_installed_software
  secrets:
    - name: soclib_wmi
      keys: ["WMI_SERVER", "WMI_USERNAME", "WMI_PASSWORD"]
      optional_keys: [WMI_FORCE_NTLMV2, WMI_NAMESPACE, WMI_DOMAIN]
  expects:
    ip_hostname: { type: str | None, description: "Optional. Target host.", default: null }
    namespace: { type: str | None, description: "Optional. WMI namespace. Default root/cimv2.", default: null }
    max_count: { type: int | None, description: "Optional. Maximum number of products to return (Win32_Product can be slow).", default: null }
    filter_key: { type: str | None, description: "Optional. Property for exact-match filter (e.g. Name, Vendor). Use with filter_value.", default: null }
    filter_value: { type: str | None, description: "Optional. Value for filter_key.", default: null }
  steps:
    - ref: get
      action: integrations.soclib.wmi.get_installed_software
      args:
        ip_hostname: ${{ inputs.ip_hostname }}
        namespace: ${{ inputs.namespace }}
        max_count: ${{ inputs.max_count }}
        filter_key: ${{ inputs.filter_key }}
        filter_value: ${{ inputs.filter_value }}
  returns: ${{ steps.get.result }}
