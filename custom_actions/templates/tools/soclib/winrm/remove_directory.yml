type: action
definition:
  title: "WinRM: Remove directory"
  description: Remove a directory (optionally recursive). Uses soclib_winrm secret.
  display_group: "SOCLib / Windows Remote Management"
  namespace: tools.soclib.winrm
  name: remove_directory
  secrets:
    - name: soclib_winrm
      keys: ["WINRM_ENDPOINT", "WINRM_USERNAME", "WINRM_PASSWORD", "WINRM_TRANSPORT"]
      optional_keys:
        - WINRM_PROTOCOL
        - WINRM_PORT
        - WINRM_DOMAIN
        - WINRM_VERIFY_SSL
        - WINRM_CERT_PEM
        - WINRM_CERT_KEY_PEM
        - WINRM_CA_TRUST
  expects:
    path:
      type: str
      description: "Full path of directory to remove."
    recursive:
      type: bool
      description: "Remove recursively."
      default: false
    ip_hostname:
      type: str | None
      description: "Override target host."
      default: null
  steps:
    - ref: remove
      action: integrations.soclib.winrm.remove_directory
      args:
        path: ${{ inputs.path }}
        recursive: ${{ inputs.recursive }}
        ip_hostname: ${{ inputs.ip_hostname }}
  returns: ${{ steps.remove.result }}
