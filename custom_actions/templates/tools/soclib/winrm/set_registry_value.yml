type: action
definition:
  title: "WinRM: Set registry value"
  description: Set a registry value for remediation. Uses soclib_winrm secret.
  display_group: "SOCLib / Windows Remote Management"
  namespace: tools.soclib.winrm
  name: set_registry_value
  secrets:
    - name: soclib_winrm
      keys: ["WINRM_ENDPOINT", "WINRM_USERNAME", "WINRM_PASSWORD", "WINRM_TRANSPORT"]
      optional_keys: ["WINRM_PROTOCOL", "WINRM_PORT", "WINRM_DOMAIN", "WINRM_VERIFY_SSL", "WINRM_CERT_PEM", "WINRM_CERT_KEY_PEM", "WINRM_CA_TRUST"]
  expects:
    key_path: { type: str }
    value_name: { type: str }
    value: { type: str }
    value_kind: { type: str, default: "String" }
    ip_hostname: { type: str | None, default: null }
  steps:
    - ref: set
      action: integrations.soclib.winrm.set_registry_value
      args:
        key_path: ${{ inputs.key_path }}
        value_name: ${{ inputs.value_name }}
        value: ${{ inputs.value }}
        value_kind: ${{ inputs.value_kind }}
        ip_hostname: ${{ inputs.ip_hostname }}
  returns: ${{ steps.set.result }}
