type: action
definition:
  title: "WinRM: List hotfixes"
  description: List installed Windows hotfixes/updates. Uses soclib_winrm secret.
  display_group: "SOCLib / Windows Remote Management"
  namespace: tools.soclib.winrm
  name: get_hotfix_list

  secrets:
    - name: soclib_winrm
      keys: ["WINRM_ENDPOINT", "WINRM_USERNAME", "WINRM_PASSWORD", "WINRM_TRANSPORT"]
      optional_keys:
        - WINRM_PROTOCOL
        - WINRM_PORT
        - WINRM_DOMAIN
        - WINRM_VERIFY_SSL
        - WINRM_CERT_PEM
        - WINRM_CERT_KEY_PEM
        - WINRM_CA_TRUST

  expects:
    ip_hostname: { type: str | None, description: "Override target host.", default: null }
    max_count: { type: int | None, description: "Max number of hotfixes to return.", default: null }
  steps:
    - ref: list
      action: integrations.soclib.winrm.get_hotfix_list
      args:
        ip_hostname: ${{ inputs.ip_hostname }}
        max_count: ${{ inputs.max_count }}

  returns: ${{ steps.list.result }}
