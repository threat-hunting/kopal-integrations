type: action
definition:
  title: "WinRM: List processes"
  description: >
    List running processes on the target host with handles, name, pid, memory, CPU, session_id.
    Uses soclib_winrm secret.
  display_group: "SOCLib / Windows Remote Management"
  namespace: tools.soclib.winrm
  name: list_processes

  secrets:
    - name: soclib_winrm
      keys: ["WINRM_ENDPOINT", "WINRM_USERNAME", "WINRM_PASSWORD", "WINRM_TRANSPORT"]
      optional_keys:
        - WINRM_PROTOCOL
        - WINRM_PORT
        - WINRM_DOMAIN
        - WINRM_VERIFY_SSL
        - WINRM_CERT_PEM
        - WINRM_CERT_KEY_PEM
        - WINRM_CA_TRUST

  expects:
    ip_hostname: { type: str | None, description: "Override target host.", default: null }
    max_count: { type: int | None, description: "Max number of processes to return.", default: null }
    name_filter: { type: str | None, description: "Substring filter on process name.", default: null }
  steps:
    - ref: list
      action: integrations.soclib.winrm.list_processes
      args:
        ip_hostname: ${{ inputs.ip_hostname }}
        max_count: ${{ inputs.max_count }}
        name_filter: ${{ inputs.name_filter }}

  returns: ${{ steps.list.result }}
