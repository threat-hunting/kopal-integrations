type: action
definition:
  title: "WinRM: Test connectivity"
  description: >
    Validate that the WinRM connection works using the configured secret (soclib_winrm).
    Runs ipconfig on the target. Use this to verify credentials and connectivity before
    running other WinRM actions.
  display_group: "SOCLib / Windows Remote Management"
  namespace: tools.soclib.winrm
  name: test_connectivity

  secrets:
    - name: soclib_winrm
      keys: ["WINRM_ENDPOINT", "WINRM_USERNAME", "WINRM_PASSWORD", "WINRM_TRANSPORT"]
      optional_keys:
        - WINRM_PROTOCOL
        - WINRM_PORT
        - WINRM_DOMAIN
        - WINRM_VERIFY_SSL
        - WINRM_CERT_PEM
        - WINRM_CERT_KEY_PEM
        - WINRM_CA_TRUST

  expects:
    ip_hostname:
      type: str | None
      description: "Optional host or URL to override WINRM_ENDPOINT."
      default: null

  steps:
    - ref: test
      action: integrations.soclib.winrm.test_connectivity
      args:
        ip_hostname: ${{ inputs.ip_hostname }}

  returns: ${{ steps.test.result }}
