type: action
definition:
  title: "WinRM: Terminate process"
  description: >
    Terminate a process on the target by PID or by name (wildcard supported).
    At least one of pid or name is required. Uses soclib_winrm secret.
  display_group: "SOCLib / Windows Remote Management"
  namespace: tools.soclib.winrm
  name: terminate_process

  secrets:
    - name: soclib_winrm
      keys: ["WINRM_ENDPOINT", "WINRM_USERNAME", "WINRM_PASSWORD", "WINRM_TRANSPORT"]
      optional_keys:
        - WINRM_PROTOCOL
        - WINRM_PORT
        - WINRM_DOMAIN
        - WINRM_VERIFY_SSL
        - WINRM_CERT_PEM
        - WINRM_CERT_KEY_PEM
        - WINRM_CA_TRUST

  expects:
    pid:
      type: int | None
      description: "Process ID to terminate."
      default: null
    name:
      type: str | None
      description: "Process name (wildcard supported). At least one of pid or name required."
      default: null
    ip_hostname:
      type: str | None
      description: "Override target host."
      default: null

  steps:
    - ref: term
      action: integrations.soclib.winrm.terminate_process
      args:
        pid: ${{ inputs.pid }}
        name: ${{ inputs.name }}
        ip_hostname: ${{ inputs.ip_hostname }}

  returns: ${{ steps.term.result }}
