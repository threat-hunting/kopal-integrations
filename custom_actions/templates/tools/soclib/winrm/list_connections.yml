type: action
definition:
  title: "WinRM: List connections"
  description: List network connections (TCP) on the target. Uses soclib_winrm secret.
  display_group: "SOCLib / Windows Remote Management"
  namespace: tools.soclib.winrm
  name: list_connections
  secrets:
    - name: soclib_winrm
      keys: ["WINRM_ENDPOINT", "WINRM_USERNAME", "WINRM_PASSWORD", "WINRM_TRANSPORT"]
      optional_keys: ["WINRM_PROTOCOL", "WINRM_PORT", "WINRM_DOMAIN", "WINRM_VERIFY_SSL", "WINRM_CERT_PEM", "WINRM_CERT_KEY_PEM", "WINRM_CA_TRUST"]
  expects:
    ip_hostname: { type: str | None, description: "Override target host.", default: null }
    max_count: { type: int | None, description: "Max number of connections to return.", default: null }
    state_filter: { type: str | None, description: "Filter by state (e.g. Listen, Established).", default: null }
  steps:
    - ref: list
      action: integrations.soclib.winrm.list_connections
      args:
        ip_hostname: ${{ inputs.ip_hostname }}
        max_count: ${{ inputs.max_count }}
        state_filter: ${{ inputs.state_filter }}
  returns: ${{ steps.list.result }}
