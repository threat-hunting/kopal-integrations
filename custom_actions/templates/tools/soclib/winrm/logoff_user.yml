type: action
definition:
  title: "WinRM: Logoff user"
  description: Log off a user session by session ID. Uses soclib_winrm secret.
  display_group: "SOCLib / Windows Remote Management"
  namespace: tools.soclib.winrm
  name: logoff_user

  secrets:
    - name: soclib_winrm
      keys: ["WINRM_ENDPOINT", "WINRM_USERNAME", "WINRM_PASSWORD", "WINRM_TRANSPORT"]
      optional_keys: ["WINRM_PROTOCOL", "WINRM_PORT", "WINRM_DOMAIN", "WINRM_VERIFY_SSL", "WINRM_CERT_PEM", "WINRM_CERT_KEY_PEM", "WINRM_CA_TRUST"]

  expects:
    session_id:
      type: str
      description: "Session ID to log off."
    ip_hostname:
      type: str | None
      default: null

  steps:
    - ref: logoff
      action: integrations.soclib.winrm.logoff_user
      args:
        session_id: ${{ inputs.session_id }}
        ip_hostname: ${{ inputs.ip_hostname }}

  returns: ${{ steps.logoff.result }}
