type: action
definition:
  title: "WinRM: Copy file"
  description: Copy a file on the target from source to destination. Uses soclib_winrm secret.
  display_group: "SOCLib / Windows Remote Management"
  namespace: tools.soclib.winrm
  name: copy_file
  secrets:
    - name: soclib_winrm
      keys: ["WINRM_ENDPOINT", "WINRM_USERNAME", "WINRM_PASSWORD", "WINRM_TRANSPORT"]
      optional_keys: ["WINRM_PROTOCOL", "WINRM_PORT", "WINRM_DOMAIN", "WINRM_VERIFY_SSL", "WINRM_CERT_PEM", "WINRM_CERT_KEY_PEM", "WINRM_CA_TRUST"]
  expects:
    from_path: { type: str }
    to_path: { type: str }
    ip_hostname: { type: str | None, default: null }
  steps:
    - ref: copy
      action: integrations.soclib.winrm.copy_file
      args:
        from_path: ${{ inputs.from_path }}
        to_path: ${{ inputs.to_path }}
        ip_hostname: ${{ inputs.ip_hostname }}
  returns: ${{ steps.copy.result }}
