type: action
definition:
  title: "Telegram: Send contact"
  description: >
    Prevent forwarding/saving when true.
  display_group: "SOCLib / Telegram"
  namespace: tools.soclib.telegram
  name: send_contact

  secrets:
    - name: soclib_telegram
      keys: ["TELEGRAM_BOT_TOKEN"]
      optional_keys:
        - TELEGRAM_DEFAULT_CHAT_ID
        - TELEGRAM_API_BASE_URL
        - TELEGRAM_DEFAULT_PARSE_MODE
        - TELEGRAM_WEBHOOK_SECRET

  expects:
    phone_number:
      type: str
      description: Contact phone number in international format..
    first_name:
      type: str
      description: Contact first name..
    chat_id:
      type: str | None
      description: Target chat. Uses secret default if omitted..
      default: null
    last_name:
      type: str | None
      description: Contact last name..
      default: null
    vcard:
      type: str | None
      description: Additional vCard data..
      default: null
    disable_notification:
      type: bool | None
      description: Send silently when true..
      default: null
    reply_to_message_id:
      type: int | None
      description: Reply to an existing message id..
      default: null
    message_thread_id:
      type: int | None
      description: Forum topic thread id..
      default: null
    protect_content:
      type: bool | None
      description: Prevent forwarding/saving when true..
      default: null

  steps:
    - ref: run
      action: integrations.soclib.telegram.send_contact
      args:
        phone_number: ${{ inputs.phone_number }}
        first_name: ${{ inputs.first_name }}
        chat_id: ${{ inputs.chat_id }}
        last_name: ${{ inputs.last_name }}
        vcard: ${{ inputs.vcard }}
        disable_notification: ${{ inputs.disable_notification }}
        reply_to_message_id: ${{ inputs.reply_to_message_id }}
        message_thread_id: ${{ inputs.message_thread_id }}
        protect_content: ${{ inputs.protect_content }}

  returns: ${{ steps.run.result }}
