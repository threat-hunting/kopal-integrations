type: action
definition:
  title: "Telegram: Forward message"
  description: >
    Prevent forwarding/saving when true.
  display_group: "SOCLib / Telegram"
  namespace: tools.soclib.telegram
  name: forward_message

  secrets:
    - name: soclib_telegram
      keys: ["TELEGRAM_BOT_TOKEN"]
      optional_keys:
        - TELEGRAM_DEFAULT_CHAT_ID
        - TELEGRAM_API_BASE_URL
        - TELEGRAM_DEFAULT_PARSE_MODE
        - TELEGRAM_WEBHOOK_SECRET

  expects:
    from_chat_id:
      type: str
      description: Source chat id or @username..
    message_id:
      type: str
      description: Message id in the source chat..
    chat_id:
      type: str | None
      description: Destination chat. Uses secret default if omitted..
      default: null
    disable_notification:
      type: bool | None
      description: Forward silently when true..
      default: null
    message_thread_id:
      type: int | None
      description: Forum topic thread id..
      default: null
    protect_content:
      type: bool | None
      description: Prevent forwarding/saving when true..
      default: null

  steps:
    - ref: run
      action: integrations.soclib.telegram.forward_message
      args:
        from_chat_id: ${{ inputs.from_chat_id }}
        message_id: ${{ inputs.message_id }}
        chat_id: ${{ inputs.chat_id }}
        disable_notification: ${{ inputs.disable_notification }}
        message_thread_id: ${{ inputs.message_thread_id }}
        protect_content: ${{ inputs.protect_content }}

  returns: ${{ steps.run.result }}
