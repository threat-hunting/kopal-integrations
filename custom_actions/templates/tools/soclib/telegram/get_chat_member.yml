type: action
definition:
  title: "Telegram: Get chat member"
  description: >
    Chat id or @channelusername. Uses secret default if omitted.
  display_group: "SOCLib / Telegram"
  namespace: tools.soclib.telegram
  name: get_chat_member

  secrets:
    - name: soclib_telegram
      keys: ["TELEGRAM_BOT_TOKEN"]
      optional_keys:
        - TELEGRAM_DEFAULT_CHAT_ID
        - TELEGRAM_API_BASE_URL
        - TELEGRAM_DEFAULT_PARSE_MODE
        - TELEGRAM_WEBHOOK_SECRET

  expects:
    user_id:
      type: str
      description: Telegram user id to look up in the chat..
    chat_id:
      type: str | None
      description: Chat id or @channelusername. Uses secret default if omitted..
      default: null

  steps:
    - ref: run
      action: integrations.soclib.telegram.get_chat_member
      args:
        user_id: ${{ inputs.user_id }}
        chat_id: ${{ inputs.chat_id }}

  returns: ${{ steps.run.result }}
