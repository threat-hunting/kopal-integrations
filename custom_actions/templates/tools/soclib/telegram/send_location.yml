type: action
definition:
  title: "Telegram: Send location"
  description: >
    Prevent forwarding/saving when true.
  display_group: "SOCLib / Telegram"
  namespace: tools.soclib.telegram
  name: send_location

  secrets:
    - name: soclib_telegram
      keys: ["TELEGRAM_BOT_TOKEN"]
      optional_keys:
        - TELEGRAM_DEFAULT_CHAT_ID
        - TELEGRAM_API_BASE_URL
        - TELEGRAM_DEFAULT_PARSE_MODE
        - TELEGRAM_WEBHOOK_SECRET

  expects:
    latitude:
      type: str
      description: Latitude of the location..
    longitude:
      type: str
      description: Longitude of the location..
    chat_id:
      type: str | None
      description: Target chat. Uses secret default if omitted..
      default: null
    horizontal_accuracy:
      type: float | None
      description: Location accuracy radius in meters..
      default: null
    live_period:
      type: int | None
      description: Live location period in seconds (60–86400)..
      default: null
    heading:
      type: int | None
      description: Direction in degrees (1–360)..
      default: null
    proximity_alert_radius:
      type: int | None
      description: Proximity alert radius in meters..
      default: null
    disable_notification:
      type: bool | None
      description: Send silently when true..
      default: null
    reply_to_message_id:
      type: int | None
      description: Reply to an existing message id..
      default: null
    message_thread_id:
      type: int | None
      description: Forum topic thread id..
      default: null
    protect_content:
      type: bool | None
      description: Prevent forwarding/saving when true..
      default: null

  steps:
    - ref: run
      action: integrations.soclib.telegram.send_location
      args:
        latitude: ${{ inputs.latitude }}
        longitude: ${{ inputs.longitude }}
        chat_id: ${{ inputs.chat_id }}
        horizontal_accuracy: ${{ inputs.horizontal_accuracy }}
        live_period: ${{ inputs.live_period }}
        heading: ${{ inputs.heading }}
        proximity_alert_radius: ${{ inputs.proximity_alert_radius }}
        disable_notification: ${{ inputs.disable_notification }}
        reply_to_message_id: ${{ inputs.reply_to_message_id }}
        message_thread_id: ${{ inputs.message_thread_id }}
        protect_content: ${{ inputs.protect_content }}

  returns: ${{ steps.run.result }}
