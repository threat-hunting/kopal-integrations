type: action
definition:
  title: "Telegram: Delete webhook"
  description: >
    Drop pending updates when removing webhook.
  display_group: "SOCLib / Telegram"
  namespace: tools.soclib.telegram
  name: delete_webhook

  secrets:
    - name: soclib_telegram
      keys: ["TELEGRAM_BOT_TOKEN"]
      optional_keys:
        - TELEGRAM_DEFAULT_CHAT_ID
        - TELEGRAM_API_BASE_URL
        - TELEGRAM_DEFAULT_PARSE_MODE
        - TELEGRAM_WEBHOOK_SECRET

  expects:
    drop_pending_updates:
      type: bool | None
      description: Drop pending updates when removing webhook..
      default: null

  steps:
    - ref: run
      action: integrations.soclib.telegram.delete_webhook
      args:
        drop_pending_updates: ${{ inputs.drop_pending_updates }}

  returns: ${{ steps.run.result }}
