type: action
definition:
  title: "Telegram: Send media group"
  description: >
    Send 2–10 photos or documents as an album via sendMediaGroup.
    media_json is a JSON array of InputMediaPhoto or InputMediaDocument objects.
  display_group: "SOCLib / Telegram"
  namespace: tools.soclib.telegram
  name: send_media_group
  doc_url: https://core.telegram.org/bots/api#sendmediagroup

  secrets:
    - name: soclib_telegram
      keys: ["TELEGRAM_BOT_TOKEN"]
      optional_keys:
        - TELEGRAM_DEFAULT_CHAT_ID
        - TELEGRAM_API_BASE_URL
        - TELEGRAM_DEFAULT_PARSE_MODE

  expects:
    media_json:
      type: str
      description: JSON array of InputMedia objects (2–10 items).
    chat_id:
      type: str | None
      description: Target chat. Uses TELEGRAM_DEFAULT_CHAT_ID if omitted.
      default: null
    disable_notification:
      type: bool | None
      description: Send silently when true.
      default: null
    message_thread_id:
      type: int | None
      description: Forum topic thread id.
      default: null
    protect_content:
      type: bool | None
      description: Prevent forwarding/saving when true.
      default: null

  steps:
    - ref: send
      action: integrations.soclib.telegram.send_media_group
      args:
        media_json: ${{ inputs.media_json }}
        chat_id: ${{ inputs.chat_id }}
        disable_notification: ${{ inputs.disable_notification }}
        message_thread_id: ${{ inputs.message_thread_id }}
        protect_content: ${{ inputs.protect_content }}

  returns: ${{ steps.send.result }}
