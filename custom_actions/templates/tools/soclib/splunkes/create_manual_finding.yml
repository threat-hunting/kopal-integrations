type: action
definition:
  title: "Splunk ES: Create manual finding"
  description: >
    Create a manual finding in Splunk ES.
    Requires rule_title, rule_description, security_domain, risk_object, risk_object_type, and risk_score.
    Returns the created finding with finding_id.
  display_group: "SOCLib / Splunk Enterprise Security"
  namespace: tools.soclib.splunkes
  name: create_manual_finding
  doc_url: https://help.splunk.com/en/splunk-enterprise-security-8/api-reference/8.4/splunk-enterprise-security-api-reference/findings/public_v2_create_manual_finding

  secrets:
    - name: soclib_splunk_es
      keys: ["SPLUNK_BASE_URL", "SPLUNK_API_TOKEN"]
      optional_keys: ["SPLUNK_VERIFY_SSL", "SPLUNK_NAMESPACE_OWNER", "SPLUNK_NAMESPACE_APP"]

  expects:
    rule_title:
      type: str
      description: The rule title for the manual finding (required).
    rule_description:
      type: str
      description: The rule description for the manual finding (required).
    security_domain:
      type: str
      description: The security domain (e.g., 'threat', 'access', 'endpoint') (required).
    risk_object:
      type: str
      description: The risk object (e.g., username, hostname, IP) (required).
    risk_object_type:
      type: str
      description: The risk object type (e.g., 'user', 'system', 'other') (required).
    risk_score:
      type: float
      description: The risk score (required).
    status:
      type: str | None
      description: The status id or status label (e.g., 'New').
      default: null
    urgency:
      type: str | None
      description: "Urgency: 'informational', 'low', 'medium', 'high', 'critical', 'unknown'."
      default: null
    owner:
      type: str | None
      description: The owner for the manual finding.
      default: null
    disposition:
      type: str | None
      description: The disposition id or disposition label.
      default: null

  steps:
    - ref: create
      action: integrations.soclib.splunkes.create_manual_finding
      args:
        rule_title: ${{ inputs.rule_title }}
        rule_description: ${{ inputs.rule_description }}
        security_domain: ${{ inputs.security_domain }}
        risk_object: ${{ inputs.risk_object }}
        risk_object_type: ${{ inputs.risk_object_type }}
        risk_score: ${{ inputs.risk_score }}
        status: ${{ inputs.status }}
        urgency: ${{ inputs.urgency }}
        owner: ${{ inputs.owner }}
        disposition: ${{ inputs.disposition }}

  returns: ${{ steps.create.result }}
