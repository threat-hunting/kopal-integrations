type: action
definition:
  title: "Splunk ES: Get host events"
  description: >
    Get events pertaining to a host that have occurred in the last N days.
    Searches the default index for events matching the hostname.
    Returns a list of events.
  display_group: "SOCLib / Splunk Enterprise Security"
  namespace: tools.soclib.splunkes
  name: get_host_events
  doc_url: https://docs.splunk.com/Documentation/Splunk/latest/RESTREF/RESTsearch#search.2Fjobs

  secrets:
    - name: soclib_splunk_es
      keys: ["SPLUNK_BASE_URL", "SPLUNK_API_TOKEN"]
      optional_keys: ["SPLUNK_VERIFY_SSL", "SPLUNK_NAMESPACE_OWNER", "SPLUNK_NAMESPACE_APP"]

  expects:
    hostname:
      type: str
      description: Hostname or IP address to search events for.
    last_n_days:
      type: int
      description: Number of days to look back (must be > 0).
      default: 7

  steps:
    - ref: get
      action: integrations.soclib.splunkes.get_host_events
      args:
        hostname: ${{ inputs.hostname }}
        last_n_days: ${{ inputs.last_n_days }}

  returns: ${{ steps.get.result }}
