type: action
definition:
  title: "Splunk ES: Delete investigation note"
  description: >
    Delete a note from an investigation in Splunk ES.
    Returns success status.
  display_group: "SOCLib / Splunk Enterprise Security"
  namespace: tools.soclib.splunkes
  name: delete_investigation_note
  doc_url: https://help.splunk.com/en/splunk-enterprise-security-8/api-reference/8.4/splunk-enterprise-security-api-reference/investigation/public_v2_delete_note_from_investigation

  secrets:
    - name: soclib_splunk_es
      keys: ["SPLUNK_BASE_URL", "SPLUNK_API_TOKEN"]
      optional_keys: ["SPLUNK_VERIFY_SSL", "SPLUNK_NAMESPACE_OWNER", "SPLUNK_NAMESPACE_APP"]

  expects:
    investigation_id:
      type: str
      description: Investigation ID (GUID) or display_id.
    note_id:
      type: str
      description: Note ID.

  steps:
    - ref: delete
      action: integrations.soclib.splunkes.delete_investigation_note
      args:
        investigation_id: ${{ inputs.investigation_id }}
        note_id: ${{ inputs.note_id }}

  returns: ${{ steps.delete.result }}
