type: action
definition:
  title: "Splunk ES: Update risk scores"
  description: >
    Update risk modifiers for an entity in Splunk ES.
    Entity format: 'type:value' (e.g., 'user:admin', 'system:192.168.1.1').
    Risk modifiers should include modifier_type, modifier_value, and reason.
    Returns the result of the update operation.
  display_group: "SOCLib / Splunk Enterprise Security"
  namespace: tools.soclib.splunkes
  name: update_risk_scores
  doc_url: https://help.splunk.com/en/splunk-enterprise-security-8/api-reference/8.4/splunk-enterprise-security-api-reference/risks/public_v2_risk_entity_risk_scores_update

  secrets:
    - name: soclib_splunk_es
      keys: ["SPLUNK_BASE_URL", "SPLUNK_API_TOKEN"]
      optional_keys: ["SPLUNK_VERIFY_SSL", "SPLUNK_NAMESPACE_OWNER", "SPLUNK_NAMESPACE_APP"]

  expects:
    entity:
      type: str
      description: Entity identifier in format 'type:value' (e.g., 'user:admin', 'system:192.168.1.1').
    risk_modifiers:
      type: any
      description: List of risk modifiers with modifier_type, modifier_value, and reason.

  steps:
    - ref: update
      action: integrations.soclib.splunkes.update_risk_scores
      args:
        entity: ${{ inputs.entity }}
        risk_modifiers: ${{ inputs.risk_modifiers }}

  returns: ${{ steps.update.result }}
