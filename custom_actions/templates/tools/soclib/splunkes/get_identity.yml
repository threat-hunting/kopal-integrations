type: action
definition:
  title: "Splunk ES: Get identity"
  description: >
    Retrieve identity information by ID from Splunk ES.
    Returns identity details.
  display_group: "SOCLib / Splunk Enterprise Security"
  namespace: tools.soclib.splunkes
  name: get_identity
  doc_url: https://help.splunk.com/en/splunk-enterprise-security-8/api-reference/8.4/splunk-enterprise-security-api-reference/identity/public_v2_get_identity

  secrets:
    - name: soclib_splunk_es
      keys: ["SPLUNK_BASE_URL", "SPLUNK_API_TOKEN"]
      optional_keys: ["SPLUNK_VERIFY_SSL", "SPLUNK_NAMESPACE_OWNER", "SPLUNK_NAMESPACE_APP"]

  expects:
    id:
      type: str
      description: Identity ID.

  steps:
    - ref: get
      action: integrations.soclib.splunkes.get_identity
      args:
        id: ${{ inputs.id }}

  returns: ${{ steps.get.result }}
