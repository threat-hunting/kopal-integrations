type: action
definition:
  title: "Splunk ES: Create investigation note"
  description: >
    Create a new note for an investigation in Splunk ES.
    Requires content; optionally includes title and files.
    Returns the created note with note_id.
  display_group: "SOCLib / Splunk Enterprise Security"
  namespace: tools.soclib.splunkes
  name: create_investigation_note
  doc_url: https://help.splunk.com/en/splunk-enterprise-security-8/api-reference/8.4/splunk-enterprise-security-api-reference/investigation/public_v2_add_note_to_investigation

  secrets:
    - name: soclib_splunk_es
      keys: ["SPLUNK_BASE_URL", "SPLUNK_API_TOKEN"]
      optional_keys: ["SPLUNK_VERIFY_SSL", "SPLUNK_NAMESPACE_OWNER", "SPLUNK_NAMESPACE_APP"]

  expects:
    investigation_id:
      type: str
      description: Investigation ID (GUID) or display_id.
    content:
      type: str
      description: The data stored within the note (required).
    title:
      type: str | None
      description: The title of the note.
      default: null
    files:
      type: list[str] | None
      description: An array of file IDs to add to the note.
      default: null

  steps:
    - ref: create
      action: integrations.soclib.splunkes.create_investigation_note
      args:
        investigation_id: ${{ inputs.investigation_id }}
        content: ${{ inputs.content }}
        title: ${{ inputs.title }}
        files: ${{ inputs.files }}

  returns: ${{ steps.create.result }}
