type: action
definition:
  title: "Splunk ES: Get risk scores"
  description: >
    Retrieve risk scores for an entity (user, system, etc.) from Splunk ES.
    Entity format: 'type:value' (e.g., 'user:admin', 'system:192.168.1.1').
    Returns risk scores for the entity.
  display_group: "SOCLib / Splunk Enterprise Security"
  namespace: tools.soclib.splunkes
  name: get_risk_scores
  doc_url: https://help.splunk.com/en/splunk-enterprise-security-8/api-reference/8.4/splunk-enterprise-security-api-reference/risks/public_v2_risk_entity_risk_scores_retrieve

  secrets:
    - name: soclib_splunk_es
      keys: ["SPLUNK_BASE_URL", "SPLUNK_API_TOKEN"]
      optional_keys: ["SPLUNK_VERIFY_SSL", "SPLUNK_NAMESPACE_OWNER", "SPLUNK_NAMESPACE_APP"]

  expects:
    entity:
      type: str
      description: Entity identifier in format 'type:value' (e.g., 'user:admin', 'system:192.168.1.1').

  steps:
    - ref: get
      action: integrations.soclib.splunkes.get_risk_scores
      args:
        entity: ${{ inputs.entity }}

  returns: ${{ steps.get.result }}
