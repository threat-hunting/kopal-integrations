type: action
definition:
  title: "AD: Create contact"
  description: >
    Create a new contact object in Active Directory. Specify the full DN where the
    contact will be created, display name, and optional email, description, telephone, title,
    and custom_attributes.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: create_contact
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    contact_dn:
      type: str
      description: "Full DN for the new contact (container path)."
    display_name:
      type: str
      description: "Display name of the contact."
    email:
      type: str
      description: "Email address (optional)."
      default: null
    description:
      type: str
      description: "Contact description (optional)."
      default: null
    telephone:
      type: str
      description: "Telephone number (optional)."
      default: null
    title:
      type: str
      description: "Job title (optional)."
      default: null
    custom_attributes:
      type: any
      description: "Additional LDAP attributes as key-value dict (optional)."
      default: null
  steps:
    - ref: contact
      action: integrations.soclib.ad.create_contact
      args:
        contact_dn: ${{ inputs.contact_dn }}
        display_name: ${{ inputs.display_name }}
        email: ${{ inputs.email }}
        description: ${{ inputs.description }}
        telephone: ${{ inputs.telephone }}
        title: ${{ inputs.title }}
        custom_attributes: ${{ inputs.custom_attributes }}
  returns: ${{ steps.contact.result }}
