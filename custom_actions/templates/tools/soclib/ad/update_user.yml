type: action
definition:
  title: "AD: Update user"
  description: >
    Update one or more attributes of an existing Active Directory user. Provide the
    user identifier and a dictionary of LDAP attribute names to new values.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: update_user
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    user:
      type: str
      description: "User to update (sAMAccountName, UPN, or DN)."
    attributes:
      type: any
      description: "Dictionary of attribute names to values to set."
    identifier_type:
      type: str
      description: "How to resolve user: auto, sam, upn, or dn."
      default: "auto"
  steps:
    - ref: upd
      action: integrations.soclib.ad.update_user
      args:
        user: ${{ inputs.user }}
        attributes: ${{ inputs.attributes }}
        identifier_type: ${{ inputs.identifier_type }}
  returns: ${{ steps.upd.result }}
