type: action
definition:
  title: "AD: Get computer"
  description: >
    Lookup a single computer object in Active Directory and return its attributes.
    Optionally request extra attributes as semicolon-separated names.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: get_computer
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    computer_name:
      type: str
      description: "Computer name (CN) or full DN."
    attributes:
      type: str
      description: "Extra LDAP attributes to return (semicolon-separated)."
      default: null
  steps:
    - ref: comp
      action: integrations.soclib.ad.get_computer
      args:
        computer_name: ${{ inputs.computer_name }}
        attributes: ${{ inputs.attributes }}
  returns: ${{ steps.comp.result }}
