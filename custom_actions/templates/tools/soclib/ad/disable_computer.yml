type: action
definition:
  title: "AD: Disable computer"
  description: >
    Disable a computer account in Active Directory so it cannot authenticate.
    Provide the computer name (sAMAccountName or DN).
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: disable_computer
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    computer_name:
      type: str
      description: "Computer account name or DN."
  steps:
    - ref: dis
      action: integrations.soclib.ad.disable_computer
      args:
        computer_name: ${{ inputs.computer_name }}
  returns: ${{ steps.dis.result }}
