type: action
definition:
  title: "AD: Move object"
  description: >
    Move any AD object (user, computer, group, etc.) to another organizational unit.
    Provide the object DN and the destination OU DN.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: move_object
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    object:
      type: str
      description: "DistinguishedName of the object to move."
    destination_ou:
      type: str
      description: "DistinguishedName of the destination OU."
  steps:
    - ref: move
      action: integrations.soclib.ad.move_object
      args:
        object: ${{ inputs.object }}
        destination_ou: ${{ inputs.destination_ou }}
  returns: ${{ steps.move.result }}
