type: action
definition:
  title: "AD: Set password never expire"
  description: >
    Set or clear the "password never expires" flag for an Active Directory user.
    value true means password never expires; false means it follows policy.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: set_password_never_expire
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    user:
      type: str
      description: "User to update (sAMAccountName, UPN, or DN)."
    value:
      type: bool
      description: "True to set password never expires, false otherwise."
    identifier_type:
      type: str
      description: "How to resolve user: auto, sam, upn, or dn."
      default: "auto"
  steps:
    - ref: nexp
      action: integrations.soclib.ad.set_password_never_expire
      args:
        user: ${{ inputs.user }}
        value: ${{ inputs.value }}
        identifier_type: ${{ inputs.identifier_type }}
  returns: ${{ steps.nexp.result }}
