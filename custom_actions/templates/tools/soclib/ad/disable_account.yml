type: action
definition:
  title: "AD: Disable account"
  description: >
    Disable an Active Directory user account so it cannot log on. User can be
    sAMAccountName or distinguishedName; set use_samaccountname true for sAMAccountName.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: disable_account
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    user:
      type: str
      description: "User sAMAccountName or distinguishedName."
    use_samaccountname:
      type: bool
      description: "True if user is sAMAccountName."
      default: false
  steps:
    - ref: disable
      action: integrations.soclib.ad.disable_account
      args:
        user: ${{ inputs.user }}
        use_samaccountname: ${{ inputs.use_samaccountname }}
  returns: ${{ steps.disable.result }}
