type: action
definition:
  title: "AD: Remediate user"
  description: >
    Remediate a user account (e.g. enable account, restore group memberships, move back
    to original OU). Use actions to choose remediation steps; optional groups_to_restore
    and original_ou for full restore.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: remediate_user
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    user:
      type: str
      description: "User to remediate (sAMAccountName, UPN, or DN)."
    identifier_type:
      type: str
      description: "How to resolve user: auto, sam, upn, or dn."
      default: "auto"
    actions:
      type: str
      description: "Remediation action(s), e.g. enable."
      default: "enable"
    groups_to_restore:
      type: str
      description: "Semicolon-separated groups to restore user to (optional)."
      default: null
    original_ou:
      type: str
      description: "OU to move user back to (optional)."
      default: null
  steps:
    - ref: rem
      action: integrations.soclib.ad.remediate_user
      args:
        user: ${{ inputs.user }}
        identifier_type: ${{ inputs.identifier_type }}
        actions: ${{ inputs.actions }}
        groups_to_restore: ${{ inputs.groups_to_restore }}
        original_ou: ${{ inputs.original_ou }}
  returns: ${{ steps.rem.result }}
