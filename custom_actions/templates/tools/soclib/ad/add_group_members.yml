type: action
definition:
  title: "AD: Add group members"
  description: >
    Add one or more members to one or more groups. Members and groups are
    semicolon-separated. Set use_samaccountname true when values are sAMAccountNames.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: add_group_members
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    members:
      type: str
      description: "Semicolon-separated list of members (users or groups)."
    groups:
      type: str
      description: "Semicolon-separated list of groups."
    use_samaccountname:
      type: bool
      description: "True if members/groups are sAMAccountNames."
      default: false
  steps:
    - ref: add
      action: integrations.soclib.ad.add_group_members
      args:
        members: ${{ inputs.members }}
        groups: ${{ inputs.groups }}
        use_samaccountname: ${{ inputs.use_samaccountname }}
  returns: ${{ steps.add.result }}
