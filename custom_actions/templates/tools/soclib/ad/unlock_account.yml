type: action
definition:
  title: "AD: Unlock account"
  description: >
    Unlock a locked Active Directory account. Provide the user by sAMAccountName or
    distinguishedName; set use_samaccountname true when using sAMAccountName.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: unlock_account
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    user:
      type: str
      description: "User sAMAccountName or distinguishedName."
    use_samaccountname:
      type: bool
      description: "True if user is sAMAccountName."
      default: false
  steps:
    - ref: unlock
      action: integrations.soclib.ad.unlock_account
      args:
        user: ${{ inputs.user }}
        use_samaccountname: ${{ inputs.use_samaccountname }}
  returns: ${{ steps.unlock.result }}
