type: action
definition:
  title: "AD: Search users"
  description: >
    Advanced user search: use preset filters (disabled, locked, expired passwords, etc.)
    or a raw LDAP query. Filter by name, username, email, or department. attribute_preset
    and custom_attributes control which attributes are returned.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: search_users
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    query:
      type: str
      description: "Raw LDAP filter (overrides preset_filter)."
      default: null
    preset_filter:
      type: str
      description: "Preset: all_users, disabled_users, locked_users, expired_passwords, never_expire_passwords, service_accounts."
      default: null
    name:
      type: str
      description: "Filter by cn (wildcard OK)."
      default: null
    username:
      type: str
      description: "Filter by sAMAccountName (wildcard OK)."
      default: null
    email:
      type: str
      description: "Filter by mail."
      default: null
    department:
      type: str
      description: "Filter by department."
      default: null
    attribute_preset:
      type: str
      description: "Attribute set: basic, security, detailed, or all."
      default: "basic"
    custom_attributes:
      type: str
      description: "Extra attributes (semicolon-separated)."
      default: null
    size_limit:
      type: int
      description: "Maximum number of results."
      default: 50
    search_base:
      type: str
      description: "Search base DN (optional)."
      default: null
  steps:
    - ref: search
      action: integrations.soclib.ad.search_users
      args:
        query: ${{ inputs.query }}
        preset_filter: ${{ inputs.preset_filter }}
        name: ${{ inputs.name }}
        username: ${{ inputs.username }}
        email: ${{ inputs.email }}
        department: ${{ inputs.department }}
        attribute_preset: ${{ inputs.attribute_preset }}
        custom_attributes: ${{ inputs.custom_attributes }}
        size_limit: ${{ inputs.size_limit }}
        search_base: ${{ inputs.search_base }}
  returns: ${{ steps.search.result }}
