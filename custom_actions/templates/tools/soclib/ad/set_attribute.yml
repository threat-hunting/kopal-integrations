type: action
definition:
  title: "AD: Set attribute"
  description: >
    Add, delete, or replace a single LDAP attribute on a user. action must be ADD,
    DELETE, or REPLACE. value is required for ADD and REPLACE. User by sAMAccountName
    or DN; use_samaccountname true for sAMAccountName.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: set_attribute
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    user:
      type: str
      description: "User sAMAccountName or distinguishedName."
    attribute:
      type: str
      description: "LDAP attribute name."
    action:
      type: str
      description: "ADD, DELETE, or REPLACE."
    value:
      type: str | None
      description: "Attribute value (required for ADD/REPLACE)."
      default: null
    use_samaccountname:
      type: bool
      description: "True if user is sAMAccountName."
      default: false
  steps:
    - ref: set
      action: integrations.soclib.ad.set_attribute
      args:
        user: ${{ inputs.user }}
        attribute: ${{ inputs.attribute }}
        action: ${{ inputs.action }}
        value: ${{ inputs.value }}
        use_samaccountname: ${{ inputs.use_samaccountname }}
  returns: ${{ steps.set.result }}
