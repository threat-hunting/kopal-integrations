type: action
definition:
  title: "AD: Delete group"
  description: >
    Delete a group from Active Directory. Provide the group by sAMAccountName, DN, or
    other identifier. Use identifier_type to specify how to resolve the group (auto, sam, dn).
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: delete_group
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    group:
      type: str
      description: "Group to delete (name or DN)."
    identifier_type:
      type: str
      description: "How to resolve group: auto, sam, or dn."
      default: "auto"
  steps:
    - ref: del
      action: integrations.soclib.ad.delete_group
      args:
        group: ${{ inputs.group }}
        identifier_type: ${{ inputs.identifier_type }}
  returns: ${{ steps.del.result }}
