type: action
definition:
  title: "AD: Set password"
  description: >
    Set a user password. Provide user (sAMAccountName or DN), new password, and
    confirmation. Set use_samaccountname true when user is sAMAccountName.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: set_password
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    user:
      type: str
      description: "User sAMAccountName or distinguishedName."
    password:
      type: str
      description: "New password."
    confirm_password:
      type: str
      description: "Confirm new password (must match password)."
    use_samaccountname:
      type: bool
      description: "True if user is sAMAccountName."
      default: false
  steps:
    - ref: set
      action: integrations.soclib.ad.set_password
      args:
        user: ${{ inputs.user }}
        password: ${{ inputs.password }}
        confirm_password: ${{ inputs.confirm_password }}
        use_samaccountname: ${{ inputs.use_samaccountname }}
  returns: ${{ steps.set.result }}
