type: action
definition:
  title: "AD: Expire password"
  description: >
    Force a user to change password at next logon by expiring the current password
    in Active Directory. User is identified by sAMAccountName, UPN, or DN.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: expire_password
  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]
  expects:
    user:
      type: str
      description: "User whose password to expire (sAMAccountName, UPN, or DN)."
    identifier_type:
      type: str
      description: "How to resolve user: auto, sam, upn, or dn."
      default: "auto"
  steps:
    - ref: exp
      action: integrations.soclib.ad.expire_password
      args:
        user: ${{ inputs.user }}
        identifier_type: ${{ inputs.identifier_type }}
  returns: ${{ steps.exp.result }}
