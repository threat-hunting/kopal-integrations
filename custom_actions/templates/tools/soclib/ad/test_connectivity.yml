type: action
definition:
  title: "AD: Test connectivity"
  description: >
    Validate that the Active Directory connection works using the configured secret
    (soclib_active_directory). No inputs required. Use this to verify credentials and
    connectivity before running other AD actions.
  display_group: "SOCLib / Active Directory"
  namespace: tools.soclib.ad
  name: test_connectivity

  secrets:
    - name: soclib_active_directory
      keys: ["AD_URL", "AD_BIND_DN", "AD_BIND_PASSWORD", "AD_BASE_DN"]
      optional_keys: ["AD_SECURE_CONNECTION", "AD_VALIDATE_SSL", "AD_AUTH_TYPE", "AD_TIMEOUT"]

  expects: {}

  steps:
    - ref: test
      action: integrations.soclib.ad.test_connectivity
      args: {}

  returns: ${{ steps.test.result }}
