[build-system]
requires = ["hatchling >= 1.13.0"]
build-backend = "hatchling.build"

[project]
name = "custom_actions"                   # This must be the same name as your package
description = "SOCLib SOAR integrations for Kopal (AD, LDAP, and more)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = [
  "ldap3>=2.9",
  "pywinrm>=0.5",
  "impacket>=0.11.0",
  "httpx>=0.27",
]
# Add your pip dependencies here

[tool.hatch.version]
path = "custom_actions/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["custom_actions"]
# Include YAML templates in pip package
include = ["/custom_actions", "/custom_actions/**/*.yml"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
